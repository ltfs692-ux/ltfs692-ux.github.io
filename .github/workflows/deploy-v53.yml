name: Deploy SAIF V5.3
on:
  push:
    paths:
      - 'site-v53.tar.gz'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace site with V5.3
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'site-v53.tar.gz' \
            -exec rm -rf {} +
          tar -xzf site-v53.tar.gz -C .
      - name: Commit deployed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy SAIF V5.3 live site"
          git push
